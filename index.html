<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Favicon -->
    <link rel="icon" href="/imgs/logos.png" />

    <!-- CSS Link -->
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/profile.css" />

    <title>PixelPay Bank</title>
  </head>
  <body>
    <!-- Start login-form -->

    <div class="login-form">
      <!-- Pixelpay -->
      <div class="logo">
        <img src="imgs/pixelpaylogin.png" alt="pixelpay">
      </div>
      <!-- Pixelpay -->
      <form action="#" class="form">
        <!-- Start title Form -->
        <p class="text-login">Login to your account</p>
        <!-- End title Form -->

        <!-- Start username Input -->
        <div class="username">
          <input
            type="text"
            placeholder="Inter Your Username"
            class="input-username"
            id="input-username"
            autocomplete="off"
          />
        </div>
        <!-- End username Input -->

        <!-- Start password Input -->
        <div class="password">
          <input
            type="password"
            placeholder="Inter Your password"
            class="input-password"
            id="input-password"
          />
        </div>
        <!-- End password Input -->

        <!-- Start btn -->
        <div class="btn">
          <button class="form-btn">Go to your account</button>
        </div>
        <!-- End btn -->


        <div class="message"></div>
      </form>
    </div>
    <!-- end login-form -->

    <!-- Start User Panel -->
    <div class="user-panel">
      
      <!-- Heading Logo -->
      <div class="logo1">
        <img src="imgs/pixelpay.png" alt="pixelpay">
      </div>
       <!-- Heading Logo -->

      <!--  div for dark mode  -->
       <div class="div-darkmode">
        <img class="profile-acc" src="imgs/profile.png" alt="">
        <button id="theme-toggle" class="btn-modeChange" >
        <span id="theme-icon">🌙</span>  
        </button>
       </div>
       <!-- end of dark mode  div -->


      <!-- Start --- Top List --- User Information -->
      <div class="info__user-panel">
        <div class="user-info">
          <div class="user-info__left">
            <div class="fullName"></div>
            <div style="color: #fbd9d9;" class="email"></div>
          </div>
          <button class="btn-logout">Logout</button>
        </div>
        <div class="user-detail">
          <div class="user-detail__left">
            <span>Account No:</span>
            <div style="font-weight: bolder;" class="id"></div>
            <div style="color: #fbd9d9;" class="joinDate"></div>
          </div>
          <div class="user-info__right">
            <span>Balance:</span>
            <div class="balance"></div>
          </div>
        </div>
      </div>
      <!-- End --- Top List --- User Information -->

      <!-- Start --- Left List --- User Transactions -->
      <div class="badge__user-panel">
        <table class="badge-table">
          <thead>
            <tr class="tr">
              <th class="table-head">Type</th>
              <th class="table-head chevron-head">
                <i class="fa-solid fa-chevron-down"></i>
                Amount
              </th>
              <th class="table-head">Date</th>
              <th class="table-head">Description</th>
              <th class="table-head">Status</th>
            </tr>
          </thead>
          <tbody class="tbody"></tbody>
        </table>

        <table class="calculate">
          <thead class="thead-calc">
            <tr>
              <th>Total</th>
              <th>Deposit</th>
              <th>Withdraw</th>
            </tr>
          </thead>
          <tbody class="tbody-calc">
            <tr>
              <td style="border-radius: 0 0 0 20px;" class="total-calc"></td>
              <td class="total-deposit"></td>
              <td style="border-radius: 0 0 20px 0;" class="total-withdraw"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- End --- Left List --- User Transactions -->

      <!-- Start --- Right List --- Change -->
      <div class="change__user-panel">
        <!-- Bill section -->
         <p class="quick">Quick Actions</p> <br>
         <div class="services-container">

          <div class="service-card">
    <img src="imgs/airtime.png" alt="buy airtime">
    <h3>Airtime</h3>
    <p>Recharge your phone easily</p>
    <!-- <button>Buy Airtime</button> -->
  </div>

      <div class="service-card">
        <img src="imgs/Data.png" alt="Data Bundle">
    <h3>Buy Data</h3>
    <p>Settle other bills quickly</p>
    <!-- <button>Pay Bills</button> -->
  </div>

  <div class="service-card">
  <img src="imgs/electricity.png" alt="Data Bundle">
    <h3>Electricity</h3>
    <p>Pay your electricity bills</p>
    <!-- <button>Pay Now</button> -->
  </div>

  <div class="service-card">
  <img src="imgs/Bill.png" alt="Data Bundle">
    <h3>PayBills</h3>
    <p>Settle other bills quickly</p>
    <!-- <button>Pay Bills</button> -->
  </div>
</div>
         <!-- Bill Section -->
        <!-- Deposit -->
        <div class="deposit">
          <input type="number" class="input-deposit" placeholder="Deposit..." />
          <button class="btn-transaction btn-deposit">Deposite</button>
        </div>
        <!-- Withdraw -->
        <div class="withdraw">
          <input
            type="number"
            class="input-withdraw"
            placeholder="Withdraw..."
          />
          <button class="btn-transaction btn-withdraw">Withdraw</button>
        </div>
      </div>
      <!-- End --- Right List --- Change -->
    </div>
    <!-- End User Panel -->

    <script src="/js/app.js"></script>
  </body>
</html>
